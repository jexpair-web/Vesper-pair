<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JEXPLOIT | VESPER-XMD PAIR CODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7b2cbf;
            --secondary: #9d4edd;
            --accent: #ff9e00;
            --dark: #10002b;
            --darker: #0a0122;
            --light: #f8f9fa;
            --gray: #adb5bd;
            --card-bg: rgba(255, 255, 255, 0.05);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: var(--transition);
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(123, 44, 191, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 158, 0, 0.1) 0%, transparent 20%);
            animation: gradientPulse 15s ease infinite;
        }

        @keyframes gradientPulse {
            0% { background-position: 10% 20%, 90% 80%; }
            50% { background-position: 15% 25%, 85% 75%; }
            100% { background-position: 10% 20%, 90% 80%; }
        }

        .home-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(123, 44, 191, 0.4);
        }

        .container {
            background: rgba(16, 0, 43, 0.8);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(123, 44, 191, 0.2);
            animation: fadeIn 0.5s ease-out;
            z-index: 1;
            margin-top: 2rem;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(123, 44, 191, 0.05) 0%,
                rgba(255, 158, 0, 0.03) 50%,
                transparent 100%
            );
            transform: rotate(30deg);
            z-index: -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
            position: relative;
        }

        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(123, 44, 191, 0.3);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(123, 44, 191, 0.3); }
            100% { box-shadow: 0 0 35px rgba(123, 44, 191, 0.5); }
        }

        .bot-badge {
            display: inline-block;
            background: rgba(255, 158, 0, 0.15);
            color: var(--accent);
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 158, 0, 0.2);
            margin-bottom: 1rem;
        }

        h1 {
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--gray);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .subtitle strong {
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--light);
        }

        .input-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid rgba(123, 44, 191, 0.2);
            border-radius: 12px;
            background-color: var(--input-bg);
            color: var(--light);
            font-size: 1rem;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(123, 44, 191, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(123, 44, 191, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0) 60%
            );
            transform: translateX(-100%) rotate(30deg);
            transition: all 0.6s ease;
        }

        .btn:hover::after {
            transform: translateX(100%) rotate(30deg);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            animation: fadeIn 0.3s ease-out;
            text-align: center;
            background: rgba(123, 44, 191, 0.08);
            border: 1px solid rgba(123, 44, 191, 0.2);
        }

        #result .label {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        #pair-code {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.5rem 0;
            letter-spacing: 3px;
            animation: textGlow 2s infinite alternate;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(123, 44, 191, 0.3); }
            100% { text-shadow: 0 0 20px rgba(123, 44, 191, 0.5); }
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-width: 100px;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(123, 44, 191, 0.3);
        }

        .back-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .back-btn:hover {
            background: rgba(123, 44, 191, 0.1);
            transform: translateY(-2px);
        }

        .error-message {
            color: #f44336;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .toast {
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: none;
            margin-top: 0.8rem;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(123, 44, 191, 0.2);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 0.5rem;
            }

            .home-btn {
                top: 1rem;
                right: 1rem;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            #pair-code {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <a href="./" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
    
    <div class="container">
        <div class="logo">
            <img src="https://files.catbox.moe/xd8cvb.jpg" alt="JEXPLOIT">
        </div>
        
        <div class="bot-badge">
            <i class="fas fa-robot"></i> VESPER-XMD
        </div>
        
        <h1>Pair Code</h1>
        <p class="subtitle">Enter your WhatsApp number without <strong>+</strong> sign</p>
        
        <div class="form-group">
            <label for="phone-number">Phone Number</label>
            <div class="input-container">
                <i class="fas fa-phone"></i>
                <input type="text" id="phone-number" placeholder="e.g., 256742xxxxxxxx" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="error-message" id="error-message">Please enter a valid phone number (10-15 digits)</div>
        </div>
        
        <button id="submit" class="btn">
            <span id="btn-text"><i class="fas fa-key"></i> Get Pair Code</span>
            <span id="btn-spinner" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> Processing...
            </span>
        </button>
        
        <div id="result">
            <div class="label">Your pairing code is:</div>
            <div id="pair-code"></div>
            <div style="font-size:0.8rem; color: var(--gray); margin-bottom: 0.5rem;">
                Enter this code in your WhatsApp linked devices
            </div>
            
            <div class="action-buttons">
                <button id="copy-btn" class="action-btn copy-btn">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
                <a href="./" class="action-btn back-btn">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
            
            <div class="toast" id="toast">
                <i class="fas fa-check-circle"></i> Code copied to clipboard!
            </div>
        </div>

        <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--gray);">
            <i class="fas fa-shield-alt" style="color: var(--primary);"></i> 
            JEXPLOIT · VESPER-XMD by <strong style="color: var(--accent);">Kevin Tech</strong>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 15 : 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 10 + 5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                const duration = Math.random() * 10 + 10;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                particle.style.opacity = Math.random() * 0.4 + 0.05;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();

        const submitButton = document.getElementById('submit');
        const phoneNumberInput = document.getElementById('phone-number');
        const resultDiv = document.getElementById('result');
        const pairCodeDiv = document.getElementById('pair-code');
        const copyButton = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        const toast = document.getElementById('toast');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            return cleaned.length >= 10 && cleaned.length <= 15;
        }

        // Mock API call - replace with actual endpoint
        async function fetchPairCode(number) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const code = Math.floor(10000000 + Math.random() * 90000000).toString();
                    resolve({ code });
                }, 800);
            });
        }

        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            const phoneNumber = phoneNumberInput.value.trim();
            
            if (!validatePhoneNumber(phoneNumber)) {
                errorMessage.style.display = 'block';
                errorMessage.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    errorMessage.style.animation = '';
                }, 500);
                return;
            }
            
            errorMessage.style.display = 'none';
            
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            submitButton.disabled = true;
            
            try {
                // Replace with your actual API endpoint
                // const { data } = await axios.get(`/code?number=${phoneNumber}`);
                // const code = data.code || "ERROR";
                
                // Using mock for demo
                const result = await fetchPairCode(phoneNumber);
                const code = result.code;
                
                pairCodeDiv.textContent = code;
                resultDiv.style.display = 'block';
                
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                
            } catch (error) {
                pairCodeDiv.textContent = "SERVICE ERROR";
                resultDiv.style.display = 'block';
                console.error("Error:", error);
            } finally {
                btnText.style.display = 'inline-flex';
                btnSpinner.style.display = 'none';
                submitButton.disabled = false;
            }
        });

        copyButton.addEventListener('click', () => {
            const code = pairCodeDiv.textContent;
            if (code && code !== 'SERVICE ERROR') {
                navigator.clipboard.writeText(code).then(() => {
                    toast.style.display = 'block';
                    setTimeout(() => {
                        toast.style.display = 'none';
                    }, 2000);
                });
            }
        });

        phoneNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            
            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        });

        // Enter key support
        phoneNumberInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitButton.click();
            }
        });

        // Disable right click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
