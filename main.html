<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vesper-Xmd</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #050710;
    --bg-1: #090d1e;
    --bg-2: #0f142b;
    --panel: rgba(12, 16, 36, 0.72);
    --panel-hover: rgba(18, 24, 52, 0.85);
    --border: rgba(100, 130, 255, 0.14);
    --border-hover: rgba(100, 130, 255, 0.42);
    --blue: #5b7fff;
    --blue-soft: #8ca3ff;
    --gold: #f4b942;
    --gold-soft: #fdd98a;
    --teal: #4dd8b8;
    --text-1: #eef1fc;
    --text-2: #8a95be;
    --text-3: #4a5278;
    --font-display: 'Sora', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    color: var(--text-1);
    background: var(--bg-0);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px 64px;
    overflow-x: hidden;
  }

  /* ── BACKGROUND ──────────────────────────────── */
  .bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-glow-top {
    position: absolute;
    top: -30%;
    left: 50%;
    translate: -50% 0;
    width: 900px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(91,127,255,0.18) 0%, transparent 70%);
    animation: drift 12s ease-in-out infinite alternate;
  }

  .bg-glow-br {
    position: absolute;
    bottom: -20%;
    right: -15%;
    width: 700px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(244,185,66,0.08) 0%, transparent 70%);
    animation: drift 16s ease-in-out infinite alternate-reverse;
  }

  .bg-glow-bl {
    position: absolute;
    bottom: 0;
    left: -10%;
    width: 500px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(43,31,82,0.5) 0%, transparent 70%);
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(91,127,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,127,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }

  /* Stars */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 72% 10%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 88% 58%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 42% 82%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 8%  68%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 55% 40%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.5px 1.5px at 95% 30%, rgba(255,255,255,0.4), transparent);
  }

  @keyframes drift {
    from { transform: translate(-2%, 2%); }
    to   { transform: translate(2%, -2%); }
  }

  /* ── STAGE ───────────────────────────────────── */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 400px;
    animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── LOGO RING ───────────────────────────────── */
  .logo-ring {
    position: relative;
    width: 120px;
    height: 120px;
    display: grid;
    place-items: center;
    margin-bottom: 28px;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid transparent;
    animation: spin-ring 8s linear infinite;
  }
  .ring-1 {
    border-top-color: rgba(91,127,255,0.7);
    border-right-color: rgba(91,127,255,0.2);
    animation-duration: 8s;
  }
  .ring-2 {
    inset: 8px;
    border-bottom-color: rgba(244,185,66,0.6);
    border-left-color: rgba(244,185,66,0.15);
    animation-duration: 12s;
    animation-direction: reverse;
  }
  .ring-3 {
    inset: 16px;
    border-top-color: rgba(77,216,184,0.5);
    border-right-color: rgba(77,216,184,0.1);
    animation-duration: 6s;
  }

  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }

  .logo-pulse {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(91,127,255,0.15) 30%, transparent 70%);
    animation: pulse-glow 3s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%       { opacity: 1;   transform: scale(1.08); }
  }

  .logo-img {
    position: relative;
    z-index: 2;
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(140,163,255,0.45);
    box-shadow: 0 0 28px rgba(91,127,255,0.4), 0 0 8px rgba(0,0,0,0.5);
  }

  /* ── ONLINE BADGE ────────────────────────────── */
  .badge-online {
    position: absolute;
    bottom: 6px;
    right: 6px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px 3px 6px;
    background: rgba(9,16,36,0.9);
    border: 1px solid rgba(77,216,184,0.4);
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--teal);
    backdrop-filter: blur(6px);
  }

  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--teal);
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }

  /* ── COPY ────────────────────────────────────── */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--blue-soft);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    background: linear-gradient(135deg, #fff 30%, var(--blue-soft) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    line-height: 1.15;
  }

  .lede {
    font-size: 14px;
    color: var(--text-2);
    text-align: center;
    max-width: 280px;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  /* ── OPTION CARDS ────────────────────────────── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    cursor: pointer;
    color: inherit;
    font-family: inherit;
    text-align: left;
    transition: border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.25s;
  }

  .opt:hover {
    border-color: var(--border-hover);
    background: var(--panel-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(91,127,255,0.14);
  }

  .opt:active  { transform: scale(0.99) translateY(0); }
  .opt:focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 3px; }

  .opt-icon {
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(91,127,255,0.12);
    border: 1px solid rgba(91,127,255,0.18);
    color: var(--blue-soft);
    transition: background 0.2s, border-color 0.2s;
  }

  .opt:hover .opt-icon {
    background: rgba(91,127,255,0.22);
    border-color: rgba(91,127,255,0.35);
  }

  .opt-icon svg { width: 20px; height: 20px; }

  .opt--gold .opt-icon {
    background: rgba(244,185,66,0.1);
    border-color: rgba(244,185,66,0.2);
    color: var(--gold-soft);
  }
  .opt--gold:hover .opt-icon {
    background: rgba(244,185,66,0.2);
    border-color: rgba(244,185,66,0.4);
  }
  .opt--gold:hover { box-shadow: 0 8px 32px rgba(244,185,66,0.1); }
  .opt--gold:hover .opt-arrow { color: var(--gold-soft); }

  .opt--teal .opt-icon {
    background: rgba(77,216,184,0.1);
    border-color: rgba(77,216,184,0.2);
    color: var(--teal);
  }
  .opt--teal:hover .opt-icon {
    background: rgba(77,216,184,0.18);
    border-color: rgba(77,216,184,0.38);
  }
  .opt--teal:hover { box-shadow: 0 8px 32px rgba(77,216,184,0.1); }
  .opt--teal:hover .opt-arrow { color: var(--teal); }

  .opt-copy  { flex: 1; min-width: 0; }

  .opt-title {
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: var(--text-1);
  }

  .opt-desc {
    display: block;
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .opt-arrow {
    flex-shrink: 0;
    color: var(--text-3);
    transition: transform 0.2s, color 0.2s;
  }
  .opt-arrow svg { width: 16px; height: 16px; display: block; }
  .opt:hover .opt-arrow { transform: translateX(3px); color: var(--blue-soft); }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    color: var(--text-3);
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    margin: 4px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── FOOTER ──────────────────────────────────── */
  .footer {
    position: relative;
    z-index: 1;
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .footer-brand {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--text-3);
  }

  .footer-tagline {
    font-size: 11.5px;
    color: var(--text-3);
    font-style: italic;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .stage { animation: none; }
    .ring, .logo-pulse { animation: none; }
    .badge-dot { animation: none; opacity: 1; }
    .bg-glow-top, .bg-glow-br { animation: none; }
  }

  @media (max-width: 420px) {
    h1 { font-size: 25px; }
    .logo-img { width: 72px; height: 72px; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-glow-top"></div>
    <div class="bg-glow-br"></div>
    <div class="bg-glow-bl"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="stage">
    <div class="logo-ring">
      <div class="logo-pulse"></div>
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <img class="logo-img" src="https://files.catbox.moe/atfp7w.jpg" alt="Vesper logo" onerror="this.style.display='none'">
      <div class="badge-online"><span class="badge-dot"></span>ONLINE</div>
    </div>

    <p class="eyebrow">Session Linker</p>
    <h1>Connect Vesper<br>to WhatsApp</h1>
    <p class="lede">Choose how you'd like to link your WhatsApp account to the bot.</p>

    <div class="options">
      <button class="opt" onclick="location.href='/pair'">
        <span class="opt-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <path d="M12 18h.01"/>
          </svg>
        </span>
        <span class="opt-copy">
          <span class="opt-title">Pair with Phone Number</span>
          <span class="opt-desc">Get a pairing code — fastest method</span>
        </span>
        <span class="opt-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <div class="divider">or</div>

      <button class="opt opt--gold" onclick="location.href='/qr'">
        <span class="opt-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/>
            <rect x="3" y="15" width="6" height="6" rx="1"/>
            <path d="M15 15h.01M15 18h3M18 15v3M18 18h3v3M21 15v.01"/>
          </svg>
        </span>
        <span class="opt-copy">
          <span class="opt-title">Scan a QR Code</span>
          <span class="opt-desc">Open WhatsApp and scan to connect</span>
        </span>
        <span class="opt-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <button class="opt opt--teal" onclick="window.open('https://github.com/vinicbot-dev/Vesper-Xmd/fork')">
        <span class="opt-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="12" cy="19" r="2"/>
            <path d="M6 7v2.5q0 2.5 6 2.5t6-2.5V7M12 14v3"/>
          </svg>
        </span>
        <span class="opt-copy">
          <span class="opt-title">Fork the Repository</span>
          <span class="opt-desc">Deploy your own Vesper-Xmd instance</span>
        </span>
        <span class="opt-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>

    <div class="footer">
      <span class="footer-brand">⚡ VESPER-XMD · JEXPLOITDEV</span>
      <span class="footer-tagline">legally wrong, ethically right — Kelvin Tech vs everyone.</span>
    </div>
  </div>
</body>
</html>
